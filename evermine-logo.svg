<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#B26BFF"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="gemGradDark2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="infGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3E8FF"/>
      <stop offset="55%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="260" fill="#07050D"/>
  <circle cx="130" cy="130" r="95" fill="#8B5CF6" opacity="0.22" filter="url(#softGlow2)"/>

  <!-- gem icon -->
  <g filter="url(#glow2)">
    <polygon points="130,45 195,100 130,215 65,100" fill="url(#gemGrad2)" stroke="#F3E8FF" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="65,100 130,215 48,112" fill="url(#gemGradDark2)" opacity="0.55"/>
    <polygon points="195,100 130,215 212,112" fill="url(#gemGradDark2)" opacity="0.75"/>
    <polyline points="65,100 130,128 195,100" fill="none" stroke="#F3E8FF" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="128" x2="130" y2="215" stroke="#F3E8FF" stroke-width="2" opacity="0.5"/>
  </g>
  <path d="M 96 138 C 85 125, 85 151, 96 138 C 107 125, 116 151, 130 138 C 144 125, 153 151, 164 138 C 175 125, 175 151, 164 138"
        fill="none" stroke="url(#infGrad2)" stroke-width="5" stroke-linecap="round" filter="url(#glow2)" opacity="0.95"/>

  <circle cx="78" cy="72" r="3" fill="#F0ABFC" opacity="0.9" filter="url(#softGlow2)"/>
  <circle cx="188" cy="78" r="2.4" fill="#C4B5FD" opacity="0.8" filter="url(#softGlow2)"/>

  <!-- wordmark -->
  <text x="245" y="150" font-family="Space Grotesk, Arial, sans-serif" font-size="86" font-weight="700" fill="url(#textGrad)" letter-spacing="-1">Evermine</text>
  <text x="248" y="188" font-family="IBM Plex Mono, monospace" font-size="22" fill="#8B7FA8" letter-spacing="2">by. Nathan Developer</text>
</svg>
