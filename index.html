<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>evermineAI V5 Flash Pro</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <div class="logo">
            🤖 evermineAI
        </div>

        <button class="new-chat">
            + Chat Baru
        </button>

        <div class="history">

            <div class="chat-item">
                💬 Percakapan Baru
            </div>

            <div class="chat-item">
                📚 Riwayat
            </div>

            <div class="chat-item">
                ⚙ Pengaturan
            </div>

        </div>

    </aside>

    <!-- ================= Main ================= -->

    <main class="main">

        <!-- Header -->

        <header class="header">

            <div class="title">

                <h1>evermineAI V5 Flash Pro</h1>

                <p>Powered by Multi AI</p>

            </div>

            <select class="model-select" id="model">

                <option>⚡ V5 Flash Pro</option>

                <option>🧠 GPT-5</option>

                <option>💎 Claude</option>

                <option>🌈 Gemini</option>

            </select>

        </header>

        <!-- Chat -->

        <section class="chat-area" id="chat">

            <div class="message ai">

                <div class="bubble">

                    <h2>👋 Selamat Datang</h2>

                    <br>

                    Halo!

                    <br><br>

                    Saya adalah <b>evermineAI V5 Flash Pro</b>.

                    <br><br>

                    Saya siap membantu Anda.

                    <br><br>

                    🚀 Pilih model AI lalu mulai bertanya.

                </div>

            </div>

        </section>

        <!-- Input -->

        <div class="input-area">

            <input
                type="text"
                id="pesan"
                placeholder="Tanyakan apa saja..."
            >

            <button id="kirim">

                Kirim

            </button>

        </div>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
