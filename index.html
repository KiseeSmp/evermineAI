<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evermine AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
  :root{
    --bg: #0A0510;
    --surface: #150B22;
    --surface-2: #1F1030;
    --text-primary: #F1E9FA;
    --text-muted: #9C87B8;
    --accent: #B14CFF;      /* ungu neon — jawaban AI */
    --accent-warm: #E29CFF; /* ungu muda — pesan pengguna */
    --border: rgba(177,76,255,0.18);
    --glow: 0 0 18px rgba(177,76,255,0.55), 0 0 40px rgba(177,76,255,0.25);
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    padding: 18px 28px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom: 1px solid var(--border);
    flex-shrink:0;
  }
  .mark{
    width:30px; height:30px;
    position:relative;
    flex-shrink:0;
  }
  .mark svg{ width:100%; height:100%; }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.25rem;
    letter-spacing: 0.01em;
    margin:0;
  }
  header .sub{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-left: 4px;
    padding-top: 2px;
  }

  /* ---------- Chat area ---------- */
  #chat{
    flex:1;
    overflow-y:auto;
    padding: 32px 0 120px 0;
    display:flex;
    flex-direction:column;
    gap: 22px;
  }
  .row{
    display:flex;
    padding: 0 8%;
    animation: rise 0.35s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .row.user{ justify-content:flex-end; }
  .row.ai{ justify-content:flex-start; }

  .bubble{
    max-width: 640px;
    padding: 14px 18px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 0.97rem;
    white-space: pre-wrap;
  }
  .row.user .bubble{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-top-right-radius: 4px;
    color: var(--text-primary);
  }
  .row.ai .bubble{
    background: transparent;
    padding-left: 0;
    border-top-left-radius: 4px;
    color: var(--text-primary);
  }
  .label{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display:block;
    margin-bottom: 6px;
  }
  .row.user .label{ color: var(--accent-warm); text-align:right; }
  .row.ai .label{ color: var(--accent); }

  .content pre{
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    margin: 10px 0;
    box-shadow: inset 0 0 20px rgba(177,76,255,0.05);
  }
  .content code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--accent-warm);
  }
  .content p code{
    background: var(--surface-2);
    padding: 2px 5px;
    border-radius: 4px;
  }
  .content .codepanel{
    position: relative;
    margin: 10px 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .content .codepanel .copy-btn{
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(20,10,30,0.55);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    padding: 5px 9px;
    border-radius: 7px;
    display:flex;
    align-items:center;
    gap: 5px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .content .codepanel .copy-btn:hover{ color: var(--accent); border-color: var(--accent); }
  .content .codepanel .copy-btn svg{ width:12px; height:12px; }
  .content .codepanel pre{
    margin:0;
    border:none;
    border-radius:0;
    background: transparent;
    padding: 16px 18px;
    padding-right: 70px;
  }
  .yml-key, .code-kw{ color: #8AB8FF; }
  .yml-str, .code-str{ color: #9CE07A; }
  .code-num{ color: var(--accent-warm); }
  .yml-comment, .code-comment{ color: var(--text-muted); font-style: italic; }
  .content img{
    max-width: 100%;
    border-radius: 10px;
    margin: 10px 0;
    border: 1px solid var(--border);
    box-shadow: var(--glow);
  }
  .content h3.md-heading{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.05rem;
    margin: 14px 0 6px 0;
    color: var(--text-primary);
  }
  .content ol, .content ul{
    margin: 6px 0;
    padding-left: 22px;
  }
  .content li{ margin: 4px 0; line-height:1.55; }
  .content p{ margin: 8px 0; }

  /* signature: ink-pulse typing indicator */
  .pulse{
    display:flex;
    gap: 5px;
    align-items:center;
    padding: 4px 0;
  }
  .pulse span{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--accent);
    opacity:0.35;
    animation: ink 1.1s infinite ease-in-out;
  }
  .pulse span:nth-child(2){ animation-delay:0.15s; }
  .pulse span:nth-child(3){ animation-delay:0.3s; }
  @keyframes ink{
    0%,80%,100%{ transform: scale(0.7); opacity:0.35; }
    40%{ transform: scale(1.15); opacity:1; }
  }

  #empty{
    margin:auto;
    text-align:center;
    color: var(--text-muted);
    max-width: 420px;
    padding: 0 24px;
  }
  #empty .mark-lg{
    width:56px;height:56px;
    margin: 0 auto 18px auto;
  }
  #empty h2{
    font-family:'Fraunces', serif;
    font-weight:500;
    color: var(--text-primary);
    font-size: 1.4rem;
    margin: 0 0 8px 0;
  }
  #empty p{ font-size:0.9rem; line-height:1.6; margin:0; }

  /* ---------- Input bar ---------- */
  #dock{
    position: fixed;
    bottom:0; left:0; right:0;
    padding: 18px 8% 22px 8%;
    background: linear-gradient(to top, var(--bg) 55%, transparent);
  }
  #inputWrap{
    max-width: 760px;
    margin: 0 auto;
    display:flex;
    align-items:flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 18px;
    transition: border-color 0.2s;
  }
  #inputWrap:focus-within{
    border-color: var(--accent);
    box-shadow: var(--glow);
  }
  #msgInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color: var(--text-primary);
    font-family:'Inter', sans-serif;
    font-size: 0.95rem;
    line-height: 1.5;
    max-height: 160px;
    padding: 6px 0;
  }
  #msgInput::placeholder{ color: var(--text-muted); }
  #sendBtn{
    background: var(--accent);
    border:none;
    width:36px; height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
  }
  #sendBtn:hover{ transform: scale(1.05); box-shadow: var(--glow); }
  #sendBtn:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }
  #sendBtn svg{ width:16px; height:16px; }

  #hint{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:0.65rem;
    color: var(--text-muted);
    margin-top: 10px;
  }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--surface-2); border-radius: 4px; }
</style>
 </head>
 <body>
  <header>
   <div class="mark" style="filter: drop-shadow(0 0 6px rgba(177,76,255,0.7));">
    <svg viewBox="0 0 30 30" fill="none">
     <path d="M15 2 C15 2 6 10 6 18 C6 23.5 10 27 15 27 C20 27 24 23.5 24 18 C24 10 15 2 15 2 Z" stroke="#B14CFF" stroke-width="1.4" /> <path d="M15 8 C15 8 10 13 10 18 C10 21 12 23 15 23" stroke="#E29CFF" stroke-width="1.2" fill="none" />
    </svg>
   </div>
   <h1>Evermine AI</h1>
   <span class="sub">/ asisten percakapan · by.nathan</span>
  </header>
  <div id="chat">
   <div id="empty">
    <div class="mark-lg" style="filter: drop-shadow(0 0 8px rgba(177,76,255,0.6));">
     <svg viewBox="0 0 30 30" fill="none">
      <path d="M15 2 C15 2 6 10 6 18 C6 23.5 10 27 15 27 C20 27 24 23.5 24 18 C24 10 15 2 15 2 Z" stroke="#B14CFF" stroke-width="1.2" /> <path d="M15 8 C15 8 10 13 10 18 C10 21 12 23 15 23" stroke="#E29CFF" stroke-width="1" fill="none" />
     </svg>
    </div>
    <h2>Mulai percakapan</h2>
    <p>Tulis apa saja di bawah — pertanyaan, kode, gambar, atau ide. Evermine AI akan menjawab langsung di sini.</p>
   </div>
  </div>
  <div id="dock">
   <div id="inputWrap">
    <button id="attachBtn" aria-label="Lampirkan foto" type="button">
     <svg viewBox="0 0 24 24" fill="none">
      <path d="M21 12.5V18a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h8" stroke="#9C87B8" stroke-width="1.6" stroke-linecap="round" /> <circle cx="8.5" cy="9.5" r="1.5" stroke="#9C87B8" stroke-width="1.4" /> <path d="M4 16l4.5-4.5a1.5 1.5 0 0 1 2.1 0L14 15" stroke="#9C87B8" stroke-width="1.4" stroke-linecap="round" /> <path d="M17 3v6M14 6h6" stroke="#B14CFF" stroke-width="1.8" stroke-linecap="round" />
     </svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;"> <textarea id="msgInput" rows="1" placeholder="Tulis pesan..."></textarea>
    <button id="sendBtn" aria-label="Kirim">
     <svg viewBox="0 0 24 24" fill="none">
      <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="#14171F" />
     </svg>
    </button>
   </div>
   <div id="previewWrap" style="display:none;"></div>
   <div id="hint">Enter untuk kirim · Shift+Enter untuk baris baru</div>
  </div>
  <style>
  #attachBtn{
    background: none;
    border: 1px solid var(--border);
    width: 34px; height: 34px;
    border-radius: 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    margin-bottom: 2px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  #attachBtn:hover{ border-color: var(--accent); box-shadow: var(--glow); }
  #previewWrap{
    max-width: 760px;
    margin: 8px auto 0 auto;
    display:flex;
    align-items:center;
    gap: 10px;
  }
  #previewWrap img{
    width: 46px; height: 46px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    box-shadow: var(--glow);
  }
  #previewWrap button{
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
  <script>
// =====================================================================
// PENTING: Ganti URL di bawah ini dengan URL worker Cloudflare kamu
// sendiri setelah deploy (lihat CARA-DEPLOY.md).
// Format-nya kira-kira: https://evermine-proxy.NAMA-AKUN-KAMU.workers.dev
// Selama masih placeholder, chat TIDAK akan berfungsi.
// =====================================================================
const API_ENDPOINT = "https://ervermine-proxy.evermine.workers.dev";

// ==== DETEKTOR ERROR SEMENTARA (buat debugging) ====
// Ini nampilin kotak merah di layar kalau ada error JS, biar kelihatan
// tanpa perlu buka Console. Boleh dihapus nanti kalau chat udah normal.
function showDebugError(label, msg) {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#ff3b3b;color:#fff;padding:12px;font-family:monospace;font-size:12px;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto;';
  box.textContent = label + ': ' + msg;
  document.body.appendChild(box);
}
window.addEventListener('error', function(e) {
  showDebugError('JS ERROR', e.message + ' (baris ' + e.lineno + ')');
});
window.addEventListener('unhandledrejection', function(e) {
  showDebugError('PROMISE ERROR', (e.reason && e.reason.message) ? e.reason.message : String(e.reason));
});
// ==== AKHIR DETEKTOR ERROR ====

const chat = document.getElementById('chat');
const empty = document.getElementById('empty');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');

let history = [];
let busy = false;
let pendingImage = null; // { mediaType, data, previewUrl }

attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const base64 = reader.result.split(',')[1];
    pendingImage = { mediaType: file.type, data: base64, previewUrl: reader.result };
    previewWrap.style.display = 'flex';
    previewWrap.innerHTML = `<img src="${reader.result}" alt="preview"><button id="removeImg" type="button">Hapus foto</button>`;
    document.getElementById('removeImg').addEventListener('click', () => {
      pendingImage = null;
      previewWrap.style.display = 'none';
      previewWrap.innerHTML = '';
      fileInput.value = '';
    });
  };
  reader.readAsDataURL(file);
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
sendBtn.addEventListener('click', send);

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightYaml(code) {
  return code.split('\n').map(line => {
    const commentMatch = line.match(/^(\s*)#(.*)$/);
    if (commentMatch) {
      return `${commentMatch[1]}<span class="yml-comment">#${commentMatch[2]}</span>`;
    }
    const kvMatch = line.match(/^(\s*(?:-\s*)?)([\w.\-]+)(:)(\s*)(.*)$/);
    if (kvMatch) {
      const [, indent, key, colon, sp, val] = kvMatch;
      const valHtml = val ? `<span class="yml-str">${val}</span>` : '';
      return `${indent}<span class="yml-key">${key}</span>${colon}${sp}${valHtml}`;
    }
    return line;
  }).join('\n');
}

const CODE_KEYWORDS = ['if','else','is','not','true','false','set','to','execute','console','command','send','stop','trigger','options','on','event','function','return','var','let','const','public','private','static','void','class','new','import','package','while','for','def','print','null','case','break'];

function highlightGeneric(code) {
  let html = code;
  html = html.replace(/(\/\/.*$|#.*$)/gm, '<span class="code-comment">$1</span>');
  html = html.replace(/"([^"\n]*)"/g, '<span class="code-str">"$1"</span>');
  html = html.replace(/\b(\d+)\b/g, '<span class="code-num">$1</span>');
  const kwPattern = new RegExp('\\b(' + CODE_KEYWORDS.join('|') + ')\\b', 'gi');
  html = html.replace(kwPattern, '<span class="code-kw">$1</span>');
  return html;
}

function fileNameFor(lang) {
  const l = (lang || '').toLowerCase();
  if (l === 'yaml' || l === 'yml') return 'config.yml';
  if (l === 'java') return 'Plugin.java';
  if (l === 'javascript' || l === 'js') return 'script.js';
  if (l === 'python' || l === 'py') return 'script.py';
  if (l === 'json') return 'data.json';
  if (l === 'sk' || l === 'skript') return 'script.sk';
  return l ? `code.${l}` : '';
}

let codeBlockStore = [];

function renderMarkdown(text) {
  codeBlockStore = [];
  // simpan blok kode dulu sebagai placeholder biar tidak terganggu proses list/heading
  let working = text.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    const l = (lang || '').toLowerCase();
    const isYaml = (l === 'yaml' || l === 'yml');
    const escaped = escapeHtml(code);
    const codeHtml = isYaml ? highlightYaml(escaped) : highlightGeneric(escaped);
    const fname = fileNameFor(lang);
    const idx = codeBlockStore.length;
    codeBlockStore.push(
      `<div class="codepanel">` +
        `<button class="copy-btn" onclick="copyCode(this, ${idx})">` +
          `<svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M5 15V6a2 2 0 0 1 2-2h9" stroke="currentColor" stroke-width="1.6"/></svg>` +
          `Salin` +
        `</button>` +
        `<pre><code>${codeHtml}</code></pre>` +
      `</div>`
    );
    codeBlockStore[idx] = { html: codeBlockStore[idx], raw: code };
    return `@@CODEBLOCK${idx}@@`;
  });

  const lines = escapeHtml(working).split('\n').map(l =>
    l.replace(/@@CODEBLOCK(\d+)@@/g, (m, i) => codeBlockStore[Number(i)].html)
  );

  let html = '';
  let listBuffer = [];
  let listType = null;

  function flushList() {
    if (listBuffer.length) {
      const tag = listType === 'ol' ? 'ol' : 'ul';
      html += `<${tag}>${listBuffer.map(li => `<li>${li}</li>`).join('')}</${tag}>`;
      listBuffer = [];
      listType = null;
    }
  }

  for (let raw of lines) {
    const line = raw;
    if (line.trim().startsWith('<div class="codepanel">')) { flushList(); html += line; continue; }
    if (line.trim() === '') { flushList(); continue; }

    const numMatch = line.match(/^\s*\d+\.\s+(.*)$/);
    const bulletMatch = line.match(/^\s*[-*]\s+(.*)$/);
    const headingBoldMatch = line.match(/^\*\*(.+)\*\*:?$/);
    const hashHeadingMatch = line.match(/^#{1,3}\s+(.*)$/);

    if (numMatch) {
      if (listType !== 'ol') { flushList(); listType = 'ol'; }
      listBuffer.push(inlineFormat(numMatch[1]));
      continue;
    }
    if (bulletMatch) {
      if (listType !== 'ul') { flushList(); listType = 'ul'; }
      listBuffer.push(inlineFormat(bulletMatch[1]));
      continue;
    }
    flushList();
    if (hashHeadingMatch) {
      html += `<h3 class="md-heading">${inlineFormat(hashHeadingMatch[1])}</h3>`;
      continue;
    }
    if (headingBoldMatch) {
      html += `<h3 class="md-heading">${inlineFormat(headingBoldMatch[1])}</h3>`;
      continue;
    }
    html += `<p>${inlineFormat(line)}</p>`;
  }
  flushList();
  return html;
}

function inlineFormat(str) {
  let out = str;
  out = out.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, (m, alt, url) => `<img src="${url}" alt="${alt}">`);
  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return out;
}

function copyCode(btn, idx) {
  const raw = codeBlockStore[idx]?.raw ?? '';
  navigator.clipboard.writeText(raw).then(() => {
    const original = btn.innerHTML;
    btn.innerHTML = 'Disalin ✓';
    setTimeout(() => { btn.innerHTML = original; }, 1500);
  });
}

function addRow(role, text) {
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'user' : 'ai');
  const label = role === 'user' ? 'Kamu' : 'Evermine';
  row.innerHTML = `<div class="bubble"><span class="label">${label}</span><span class="content"></span></div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return row.querySelector('.content');
}

function addTyping() {
  if (empty) empty.remove();
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  row.innerHTML = `<div class="bubble"><span class="label">Evermine</span><div class="pulse"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if ((!text && !pendingImage) || busy) return;
  busy = true;
  sendBtn.disabled = true;

  const userContentEl = addRow('user', text);
  let previewHtml = '';
  if (pendingImage) {
    previewHtml = `<img src="${pendingImage.previewUrl}" alt="lampiran">`;
  }
  userContentEl.innerHTML = previewHtml + renderMarkdown(text || '(foto terlampir)');

  // susun content untuk API: array jika ada gambar, string biasa jika tidak
  let apiContent;
  if (pendingImage) {
    apiContent = [
      { type: 'image', source: { type: 'base64', media_type: pendingImage.mediaType, data: pendingImage.data } },
      { type: 'text', text: text || 'Tolong lihat foto ini.' }
    ];
  } else {
    apiContent = text;
  }
  history.push({ role: 'user', content: apiContent });

  input.value = '';
  input.style.height = 'auto';
  pendingImage = null;
  previewWrap.style.display = 'none';
  previewWrap.innerHTML = '';
  fileInput.value = '';
  addTyping();

  try {
    const response = await fetch(API_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-5",
        max_tokens: 1500,
        system: "Kamu adalah Evermine AI, asisten AI buatan by.nathan yang ahli membuat plugin server Minecraft (Bukkit/Spigot/Paper) selain juga asisten umum yang ramah. Selalu balas dalam Bahasa Indonesia yang natural. ATURAN PENTING: jika pengguna meminta plugin, script, atau fitur server Minecraft apa pun (ClearLag, TP, Warp, Kit, Shop, Anti-grief, dll), langsung buatkan kodenya secara lengkap dan siap pakai — kode Java plugin utama DAN file plugin.yml/config.yml-nya, masing-masing dalam blok kode markdown terpisah, jangan tanya balik dulu kecuali benar-benar perlu.",
        messages: history
      })
    });

    if (!response.ok) {
      let detail = '';
      try {
        const errData = await response.json();
        detail = errData?.error?.message || JSON.stringify(errData);
      } catch (e) {
        detail = await response.text().catch(() => '(tidak bisa dibaca)');
      }
      throw new Error(`Status ${response.status}: ${detail}`);
    }

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const replyText = textBlocks.join('\n\n') || '(tidak ada respons teks)';

    history.push({ role: 'assistant', content: replyText });

    document.getElementById('typingRow')?.remove();
    const aiContentEl = addRow('ai', replyText);
    aiContentEl.innerHTML = renderMarkdown(replyText);
  } catch (err) {
    document.getElementById('typingRow')?.remove();
    const aiContentEl = addRow('ai', '');
    aiContentEl.innerHTML = renderMarkdown(
      `Maaf, ada masalah menghubungi server: **${err.message}**\n\nCek apakah URL proxy di kode (\`API_ENDPOINT\`) sudah benar dan worker sudah di-deploy.`
    );
  } finally {
    busy = false;
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
}
</script>
 </body>
</html>
