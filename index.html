<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>evermineAI V5 Flash Pro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/button.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            🤖 evermineAI
        </div>

        <button class="new-chat">
            + Chat Baru
        </button>

        <div class="history">

            <div class="chat-item active">
                💬 Percakapan Baru
            </div>

        </div>

        <div class="sidebar-footer">

            <button class="setting-btn">
                ⚙️ Pengaturan
            </button>

        </div>

    </aside>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <!-- Header -->

        <header class="header">

            <div class="title">

                <h1>evermineAI V5 Flash Pro</h1>

                <p>Powered by Multi AI</p>

            </div>

            <select id="model" class="model-select">

                <option>⚡ V5 Flash Pro</option>

                <option>🤖 ChatGPT</option>

                <option>🧠 Claude</option>

                <option>✨ Gemini</option>

            </select>

        </header>

        <!-- Chat -->

        <section class="chat-area" id="chat">

            <div class="message ai">

                <div class="bubble">

                    <h2>👋 Selamat Datang</h2>

                    <br>

                    Selamat datang di

                    <strong>evermineAI V5 Flash Pro</strong>

                    <br><br>

                    Saya siap membantu Anda.

                    <br><br>

                    🚀 Pilih model AI di kanan atas lalu mulai bertanya.

                </div>

            </div>

        </section>

        <!-- Input -->

        <footer class="input-area">

            <input
                id="pesan"
                type="text"
                placeholder="Tanyakan apa saja..."
                autocomplete="off">

            <button id="kirim">

                Kirim

            </button>

        </footer>

    </main>

</div>

<!-- JavaScript -->

<script src="js/storage.js"></script>
<script src="js/model.js"></script>
<script src="js/chat.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
